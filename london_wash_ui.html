<title>London Wash OS Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --paper:#f5f4f3; --surface:#ffffff; --surface-2:#f2f0ef; --surface-3:#e7e4e2;
  --ink:#201e1d; --ink-2:#67615e; --ink-3:#a19b97;
  --line:#eae7e5; --line-strong:#ddd8d5;
  --accent:#ec3013; --accent-ink:#ffffff; --accent-soft:#fde3dd;
  --accent-700:#ae1800; --accent-800:#7c1405;
  --brass:#c94b39; --brass-soft:#fde3dd;
  --ok:#189a5b; --ok-soft:#e1f6ea;
  --warn:#dd9a0c; --warn-soft:#fdf1da;
  --danger:#e23c2b; --danger-soft:#fce2df;
  --info:#3d6fe0; --info-soft:#e7edfd;
  --violet:#8457e6; --violet-soft:#efe8fd;
  --teal:#0e9488; --teal-soft:#dff5f2;
  /* soft, layered shadows — the "friendlier" card language this pass adopts */
  --shadow-sm:0 1px 2px rgba(32,28,26,.05), 0 1px 3px rgba(32,28,26,.07);
  --shadow-md:0 6px 16px -4px rgba(32,28,26,.10), 0 2px 6px -2px rgba(32,28,26,.06);
  --shadow-lg:0 20px 44px -14px rgba(32,28,26,.24);
  --shadow:var(--shadow-sm);
  --radius-sm:8px; --radius-md:12px; --radius-lg:18px; --radius-pill:999px;
  --radius:var(--radius-md);
  --sidebar-bg:#1c1a1e; --sidebar-line:#332f30; --sidebar-ink:#f3f2f2; --sidebar-ink-2:#928c8a; --sidebar-hover:#29262a;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:14px; line-height:1.5; font-variant-numeric:tabular-nums; }
h1,h2,h3,h4{ font-family:'Archivo',system-ui,sans-serif; font-weight:800; letter-spacing:-.015em; text-wrap:balance; margin:0; color:var(--ink); }
code,.mono{ font-family:'Archivo',system-ui,sans-serif; font-variant-numeric:tabular-nums; }
button{ font-family:inherit; cursor:pointer; }
input,select,textarea{ font-family:inherit; font-size:13.5px; }
a{ color:var(--accent); }
::selection{ background:var(--accent-soft); }
*:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:var(--ink-3); border-radius:8px; }

/* ---------- workspace switcher shell ---------- */
#shell{ min-height:100vh; display:flex; flex-direction:column; }
.ws-topbar{ display:flex; align-items:center; justify-content:space-between; padding:9px 20px; background:var(--sidebar-bg); color:var(--sidebar-ink); border-bottom:2px solid var(--sidebar-line); gap:16px; }
.ws-brand{ display:flex; align-items:center; gap:9px; }
.ws-brand .mark{ width:9px; height:9px; background:var(--accent); flex:none; }
.ws-brand-name{ font-family:'Archivo',sans-serif; font-weight:800; font-size:14px; letter-spacing:-.01em; }
.ws-brand-tag{ font-size:10px; color:var(--accent); letter-spacing:.1em; text-transform:uppercase; margin-left:6px; }
.ws-switch{ display:flex; gap:2px; background:var(--sidebar-hover); border-radius:var(--radius-pill); padding:3px; }
.ws-switch button{ border:none; background:transparent; padding:7px 14px; border-radius:var(--radius-pill); font-size:12px; font-weight:700; font-family:'Archivo',sans-serif; color:var(--sidebar-ink-2); }
.ws-switch button.active{ background:var(--accent); color:#fff; }
.ws-meta{ font-size:11px; color:var(--sidebar-ink-2); }
#workspaceRoot{ flex:1; min-height:0; }

/* ---------- admin console shell ---------- */
.console{ display:grid; grid-template-columns:236px 1fr; height:calc(100vh - 47px); }
.sidebar{ background:var(--sidebar-bg); color:var(--sidebar-ink); border-right:none; overflow-y:auto; padding:14px 0 24px; display:flex; flex-direction:column; }
.side-group{ font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--sidebar-ink-2); padding:16px 18px 6px; margin:0; }
.side-group:first-child{ padding-top:2px; }
.side-link{ display:flex; align-items:center; gap:10px; margin:1px 10px; padding:8px 10px; border-radius:var(--radius-sm); border-left:3px solid transparent; color:var(--sidebar-ink-2); font-size:13.5px; font-weight:500; text-decoration:none; position:relative; }
.side-link .ic{ width:26px; height:26px; flex:none; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; background:var(--sidebar-hover); color:var(--sidebar-ink-2); }
.side-link:hover{ background:var(--sidebar-hover); color:var(--sidebar-ink); }
.side-link.active{ background:var(--sidebar-hover); border-left-color:var(--accent); color:#fff; font-weight:700; }
.side-link.active .ic{ background:var(--accent); color:#fff; }
.side-link .badge-n{ margin-left:auto; background:var(--accent); color:#fff; font-size:10px; font-weight:800; padding:1px 7px; border-radius:var(--radius-pill); }
.sidebar-foot{ margin-top:auto; border-top:1px solid var(--sidebar-line); padding:14px 18px; display:flex; align-items:center; gap:10px; }
.admin-main{ overflow-y:auto; padding:0; background:var(--paper); }
.admin-topbar{ display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; padding:18px 26px 14px; border-bottom:1px solid var(--line); background:var(--paper); position:sticky; top:0; z-index:20; }
.admin-topbar-strip{ display:flex; align-items:center; gap:0; padding:0 26px; border-top:1px solid var(--line); flex-wrap:wrap; background:var(--paper); position:sticky; top:64px; z-index:19; }
.strip-item{ display:flex; align-items:center; gap:7px; padding:7px 14px 7px 0; font-size:11.5px; color:var(--ink-2); border-right:1px solid var(--line); }
.strip-item:first-child{ padding-left:0; }
.strip-item .sqdot{ width:7px; height:7px; border-radius:50%; display:block; flex:none; }
.page-kicker{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-700); }
.page-title{ font-size:27px; letter-spacing:-.02em; margin-top:4px; }
.page-sub{ display:none; }
.admin-content-pad{ padding:24px 26px 56px; }
.searchbox{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-pill); padding:0 14px; height:36px; min-width:230px; box-shadow:var(--shadow-sm); }
.searchbox input{ border:none; background:transparent; outline:none; color:var(--ink); flex:1; font-size:13px; }
.topbar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-left:auto; }
.branch-pill{ font-size:13px; border:1px solid var(--line-strong); border-radius:var(--radius-pill); padding:0 14px; height:36px; display:inline-flex; align-items:center; gap:8px; color:var(--ink); background:var(--surface); font-weight:600; }
.avatar{ width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex:none; }

/* ---------- generic building blocks ---------- */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); box-shadow:var(--shadow-sm); }
.card-pad{ padding:16px 18px; }
.section-title{ font-size:15px; font-weight:800; font-family:'Archivo',sans-serif; margin-bottom:2px; }
.small-muted{ font-size:12px; color:var(--ink-2); }
.tiny-muted{ font-size:11px; color:var(--ink-3); }
.flex-between{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.stack{ display:flex; flex-direction:column; gap:16px; }
.grid{ display:grid; gap:16px; }
.mt-8{margin-top:8px;} .mt-12{margin-top:12px;} .mt-16{margin-top:16px;} .mt-20{margin-top:20px;}

.btn{ display:inline-flex; align-items:center; gap:6px; border-radius:var(--radius-sm); padding:8px 14px; font-size:13px; font-weight:800; font-family:'Archivo',sans-serif; border:1px solid transparent; white-space:nowrap; }
.btn-primary{ background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow-sm); }
.btn-primary:hover{ background:var(--accent-700); }
.btn-outline{ background:var(--surface); border-color:var(--line-strong); color:var(--ink); }
.btn-outline:hover{ background:var(--surface-2); }
.btn-danger{ background:var(--danger); color:#fff; }
.btn-ok{ background:var(--ok); color:#fff; }
.btn-sm{ padding:6px 11px; font-size:12px; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.btn-ghost{ background:transparent; border:none; color:var(--accent); padding:5px 6px; font-weight:700; border-radius:var(--radius-sm); }
.btn-ghost:hover{ background:var(--accent-soft); }

.field label{ display:block; font-size:12px; margin-bottom:5px; color:var(--ink-2); }
.field input, .field select, .field textarea{ width:100%; min-height:36px; padding:6px 10px; border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:var(--surface); color:var(--ink); }
.field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.form-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

.pill{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; padding:3px 10px; border-radius:var(--radius-pill); letter-spacing:.02em; }
.pill.ok{ background:var(--ok-soft); color:var(--ok); }
.pill.warn{ background:var(--warn-soft); color:var(--warn); }
.pill.danger{ background:var(--danger); color:#fff; }
.pill.info{ background:var(--info-soft); color:var(--info); }
.pill.neutral{ background:var(--surface-3); color:var(--ink-2); }
.pill .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; }

table{ border-collapse:collapse; width:100%; font-size:13px; }
.tbl-wrap{ overflow-x:auto; }
th{ text-align:left; padding:8px 12px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); border-bottom:1px solid var(--line-strong); white-space:nowrap; }
td{ padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
tr:last-child td{ border-bottom:none; }
tbody tr:hover td{ background:var(--surface-2); }
.row-click{ cursor:pointer; }
td.mono{ color:var(--ink-2); }

.kpi-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:14px; }
.kpi{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 18px 14px; box-shadow:var(--shadow-sm); }
.kpi-icon{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
.kpi .k-label{ font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-2); font-weight:600; }
.kpi .k-value{ font-family:'Archivo',sans-serif; font-weight:800; font-size:30px; letter-spacing:-.03em; margin-top:6px; font-variant-numeric:tabular-nums; }
.kpi .k-delta{ font-size:11.5px; margin-top:2px; font-weight:600; }
.kpi.kpi-danger{ background:var(--accent); border-color:var(--accent); color:#fff; }
.kpi.kpi-danger .k-label{ color:rgba(255,255,255,.85); }
.kpi.kpi-danger .k-delta{ color:rgba(255,255,255,.95); }
.kpi.kpi-danger .kpi-icon{ background:rgba(255,255,255,.2); }
.kpi .k-delta.up{ color:var(--ok); } .kpi .k-delta.down{ color:var(--danger); }
@media (max-width:1400px){ .kpi-grid{ grid-template-columns:repeat(3,1fr); } }

.chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ font-size:12.5px; font-weight:700; font-family:'Archivo',sans-serif; border:1px solid var(--line-strong); border-radius:var(--radius-pill); padding:7px 14px; background:var(--surface); color:var(--ink); cursor:pointer; }
.chip.selected{ background:var(--accent); border-color:var(--accent); color:#fff; }

/* kanban */
.kanban{ display:flex; gap:14px; overflow-x:auto; padding-bottom:8px; }
.kanban-col{ background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-md); min-width:230px; flex:none; padding:10px; }
.kanban-col-head{ display:flex; justify-content:space-between; align-items:center; padding:2px 4px 10px; font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-2); }
.kanban-count{ background:var(--ink); color:var(--paper); border-radius:var(--radius-pill); padding:1px 8px; font-size:10.5px; font-weight:700; }
.g-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 11px; margin-bottom:8px; box-shadow:var(--shadow-sm); cursor:pointer; }
.g-card:hover{ border-color:var(--accent); box-shadow:var(--shadow-md); }
.g-card .gid{ font-family:'Archivo',sans-serif; font-size:11px; color:var(--accent-700); font-weight:700; }
.g-card .gname{ font-size:12.6px; font-weight:600; margin-top:3px; }
.g-card .gmeta{ font-size:10.8px; color:var(--ink-3); margin-top:3px; }
.g-card .gsla{ margin-top:7px; }

/* modal */
.modal-backdrop{ position:fixed; inset:0; background:color-mix(in srgb, var(--ink) 55%, transparent); display:flex; align-items:center; justify-content:center; z-index:80; padding:20px; }
.modal{ background:var(--surface); border-radius:var(--radius-lg); border:1px solid var(--line); box-shadow:var(--shadow-lg); width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:22px; }
.modal.wide{ max-width:760px; }
.modal h3{ font-size:19px; margin-bottom:4px; font-weight:800; }
.modal .muted{ font-size:12.5px; color:var(--ink-2); margin-bottom:16px; }

/* toggle switch */
.toggle{ width:40px; height:22px; border-radius:var(--radius-pill); background:var(--surface-3); border:1px solid var(--line-strong); position:relative; flex:none; transition:.15s; }
.toggle::after{ content:""; position:absolute; width:16px; height:16px; border-radius:50%; background:var(--ink-3); top:2px; left:2px; transition:.15s; }
.toggle.on{ background:var(--ok); border-color:var(--ok); }
.toggle.on::after{ left:20px; background:#fff; }

/* timeline (digital garment passport) */
.tl{ position:relative; padding-left:22px; }
.tl::before{ content:""; position:absolute; left:5px; top:4px; bottom:4px; width:1px; background:var(--line-strong); }
.tl-item{ position:relative; padding-bottom:18px; }
.tl-item:last-child{ padding-bottom:0; }
.tl-item::before{ content:""; position:absolute; left:-22px; top:2px; width:9px; height:9px; border-radius:0; background:var(--accent); border:2px solid var(--paper); box-shadow:0 0 0 1px var(--accent); }
.tl-item.fail::before{ background:var(--danger); box-shadow:0 0 0 1px var(--danger); }
.tl-time{ font-size:10.5px; color:var(--ink-3); font-family:'Archivo',sans-serif; }
.tl-label{ font-size:13px; font-weight:600; margin-top:1px; }
.tl-meta{ font-size:11.5px; color:var(--ink-2); margin-top:1px; }

/* AI copilot */
.chat-bubble{ max-width:80%; padding:10px 14px; border-radius:var(--radius-md); font-size:13px; line-height:1.5; }
.chat-bubble.user{ background:var(--accent); color:var(--accent-ink); margin-left:auto; border-bottom-right-radius:4px; }
.chat-bubble.ai{ background:var(--surface); border:1px solid var(--line); margin-right:auto; box-shadow:var(--shadow-sm); border-bottom-left-radius:4px; }
.chat-cite{ font-size:10.5px; color:var(--ink-3); margin-top:6px; border-top:1px dashed var(--line-strong); padding-top:6px; }

/* ---------- mobile device frame (portal / driver) ---------- */
.device-stage{ min-height:calc(100vh - 47px); display:flex; align-items:flex-start; justify-content:center; padding:34px 20px; background:var(--surface); gap:40px; flex-wrap:wrap; }
.device-col{ display:flex; flex-direction:column; align-items:center; gap:12px; }
.device-caption{ font-size:11.5px; color:var(--ink-2); text-align:center; max-width:300px; }
.device-caption b{ color:var(--ink); }
.phone{ width:360px; height:720px; background:var(--paper); border:8px solid var(--ink); border-radius:36px; box-shadow:0 20px 44px -18px rgba(0,0,0,.35); overflow:hidden; display:flex; flex-direction:column; position:relative; }
.phone-notch{ height:22px; background:var(--ink); display:flex; align-items:center; justify-content:center; }
.phone-notch::after{ content:""; width:70px; height:6px; background:#000; border-radius:4px; }
.phone-screen{ flex:1; overflow-y:auto; background:var(--paper); }
.phone-topbar{ background:var(--paper); padding:14px 16px 12px; border-bottom:2px solid var(--line); position:sticky; top:0; z-index:5; }
.phone-topbar .pt-eyebrow{ font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--accent); font-weight:800; }
.phone-topbar h2{ font-size:19px; margin-top:3px; }
.phone-body{ padding:14px 16px 90px; }
.phone-tabbar{ position:absolute; left:0; right:0; bottom:0; background:var(--sidebar-bg); border-top:none; display:flex; padding:6px 4px 8px; }
.pt-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px; border-radius:var(--radius-sm); color:var(--sidebar-ink-2); font-size:9.5px; font-weight:700; }
.pt-item .ic{ font-size:16px; }
.pt-item.active{ color:var(--accent); }

.mcard{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px; box-shadow:var(--shadow-sm); margin-bottom:12px; }
.mcard-tight{ padding:12px 14px; }
.progress-track{ height:8px; background:var(--surface-3); border-radius:var(--radius-pill); overflow:hidden; margin-top:8px;}
.progress-fill{ height:100%; background:var(--accent); border-radius:var(--radius-pill); }

[hidden]{ display:none !important; }
</style>

<div id="shell">
  <div class="ws-topbar">
    <div class="ws-brand"><span class="mark"></span><span class="ws-brand-name">The London Wash</span><span class="ws-brand-tag">UI WORKING MODEL &middot; for review</span></div>

      <button data-ws="admin" class="active">Admin Console</button>

      <button data-ws="driver">Driver App</button>
    </div>
    <div class="ws-meta">Kochi, Kerala &middot; Branch: Main Store</div>
  </div>
  <div id="workspaceRoot"></div>
</div>
<div id="modalRoot"></div>

<script>
/* ============================================================

   Click-through prototype for IA/visual review, per the approved
   blueprint LW-OS-ARCH-001 Rev 1.1. No backend — all state is
   in-memory, seeded with example data so every screen opens in a
   realistic working state.
   ============================================================ */

  {id:'C005', name:'Sooraj Nair', phone:'+91 90480 17765', tier:'Silver', points:60, wallet:15000, lifetimeSpend:198000, orders:5, addr:'Kakkanad, Kochi', consent:{whatsapp:false, sms:false, email:false}, fold:'Folded', detergent:'Regular', priceProfileId:'PL1'},

/* ---------------- seed: price list profiles & pricing ---------------- */

/* ---------------- dashboard analytics helpers ---------------- */
// A garment line item carries no price of its own (only the parent order's
// lump total does) — its price is resolved the same way POS resolves it:
// look up the ordering customer's price list profile, then the matching
// (item, service) entry in that profile. This is what lets Dashboard roll
// up "revenue by service" and "top items" honestly instead of guessing.
function garmentPrice(g, custId){
  const cust = custById(custId);
  const profileId = cust ? cust.priceProfileId : 'PL1';
  let entry = priceList.find(p=>p.profileId===profileId && p.item===g.item && p.service===g.service);
  if(!entry) entry = priceList.find(p=>p.item===g.item && p.service===g.service);
  return entry ? entry.price : 0;
}
// Small deterministic hash so "vs previous period" deltas are stable across
// re-renders (no backend history to compute real ones from yet) rather than
// jittering randomly — a seeded illustrative figure, not a real trend.
function pseudoDelta(seed, lo, hi){
  let h = 0; for(let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  const v = lo + (h % (hi-lo+1));
  return v;
}
function deltaTag(v){ return v>=0 ? `<span style="color:var(--ok);">▲ ${v}%</span>` : `<span style="color:var(--danger);">▼ ${Math.abs(v)}%</span>`; }
function garmentsForOrder(o){ return o.items; }
function orderProgress(o){
  const idx = o.items.reduce((a,g)=>a+g.stageIdx,0)/o.items.length;
  return Math.round((idx/(STAGES.length-1))*100);
}
function fakeQR(seed){
  // decorative QR-like grid, deterministic from a seed string
  let h=0; for(const c of seed) h=(h*31+c.charCodeAt(0))>>>0;
  const cells=[];
  for(let i=0;i<49;i++){ h=(h*1103515245+12345)>>>0; cells.push((h>>>16)%3===0); }
  const sz=7, cell=6;
  let rects='';
  cells.forEach((on,i)=>{ if(on){ const x=(i%sz)*cell, y=Math.floor(i/sz)*cell; rects+=`<rect x="${x}" y="${y}" width="${cell-1}" height="${cell-1}" fill="currentColor"/>`; } });
  return `<svg width="${sz*cell}" height="${sz*cell}" viewBox="0 0 ${sz*cell} ${sz*cell}">${rects}</svg>`;
}

let dashRange = '30d';
let dashSort = 'revenue';
const DASH_RANGES = [{id:'7d',name:'7 days'},{id:'30d',name:'30 days'},{id:'90d',name:'90 days'},{id:'mtd',name:'Month to date'}];
const DASH_SORTS = [{id:'revenue',name:'Revenue'},{id:'orders',name:'Orders'},{id:'garments',name:'Garments'},{id:'share',name:'Share'}];

function renderDashboard(){
  const todayOrders = orders.length;
  const revenue = orders.reduce((s,o)=>s+o.total,0);
  const garmentCount = orders.reduce((s,o)=>s+o.items.length,0);
  const aov = Math.round(revenue/todayOrders);
  const atRisk = orders.filter(o=>o.sla==='breached'||o.sla==='at_risk').length;
  const outstanding = orders.filter(o=>!o.paid).reduce((s,o)=>s+o.total,0);
  const returning = orders.filter(o=>{ const c=custById(o.custId); return c && c.orders>1; }).length;
  const repeatPct = Math.round(returning/todayOrders*100);
  const newCust = todayOrders - returning;

  // ---- service performance rollup (real data: priced off each garment's resolved price-list entry) ----
  const svcMap = {};
  orders.forEach(o=>{
    o.items.forEach(g=>{
      const k = g.service;
      if(!svcMap[k]) svcMap[k] = {name:k, orderIds:new Set(), custIds:new Set(), garments:0, revenue:0};
      const row = svcMap[k];
      row.orderIds.add(o.id); row.custIds.add(o.custId); row.garments++;
      row.revenue += garmentPrice(g, o.custId);
    });
  });
  let svcRows = Object.values(svcMap).map(s=>({
    name:s.name, orders:s.orderIds.size, customers:s.custIds.size, garments:s.garments,
    aov: s.orderIds.size ? Math.round(s.revenue/s.orderIds.size) : 0, revenue:s.revenue,
  }));
  const svcSortKey = {revenue:'revenue', orders:'orders', garments:'garments', share:'revenue'}[dashSort] || 'revenue';
  svcRows.sort((a,b)=>b[svcSortKey]-a[svcSortKey]);
  const totalSvcRev = svcRows.reduce((s,r)=>s+r.revenue,0) || 1;
  const topSvc = svcRows[0];
  const topCustSvc = svcRows.slice().sort((a,b)=>b.customers-a.customers)[0];

  // ---- channel mix ----
  const chanMap = {};
  orders.forEach(o=>{ if(!chanMap[o.channel]) chanMap[o.channel]={name:o.channel, count:0, revenue:0}; chanMap[o.channel].count++; chanMap[o.channel].revenue+=o.total; });
  const chanColors = ['#201e1d','#ec3013','#e15b47','#9b9797'];
  const channels = Object.values(chanMap).sort((a,b)=>b.revenue-a.revenue).map((c,i)=>({...c, color:chanColors[i%chanColors.length], pct: Math.round(c.revenue/revenue*100)}));

  // ---- customer segments (by tier, lifetime figures across the seeded book) ----
  const tierMap = {};
  customers.forEach(c=>{
    if(!tierMap[c.tier]) tierMap[c.tier] = {name:c.tier, count:0, revenue:0, ordersCount:0};
    tierMap[c.tier].count++; tierMap[c.tier].revenue += c.lifetimeSpend; tierMap[c.tier].ordersCount += c.orders;
  });
  const totalTierRev = Object.values(tierMap).reduce((s,t)=>s+t.revenue,0) || 1;
  const segments = Object.values(tierMap).sort((a,b)=>b.revenue-a.revenue).map(t=>({
    name:t.name, count:t.count, pct: Math.round(t.revenue/totalTierRev*100),
    aov: t.ordersCount ? Math.round(t.revenue/t.ordersCount) : 0,
  }));

  // ---- top items by revenue ----
  const itemMap = {};
  orders.forEach(o=>{
    o.items.forEach(g=>{
      const k = g.item+'|'+g.service;
      if(!itemMap[k]) itemMap[k] = {item:g.item, service:g.service, qty:0, revenue:0};
      itemMap[k].qty++; itemMap[k].revenue += garmentPrice(g, o.custId);
    });
  });
  const topItems = Object.values(itemMap).sort((a,b)=>b.revenue-a.revenue).slice(0,8);
  const maxItemRev = topItems.length ? topItems[0].revenue : 1;

  // ---- production load (garments currently sitting at each stage) ----
  const stageBuckets = [
    {label:'Sorting', stages:['Received','Inspection']},
    {label:'Washing', stages:['Washing']},
    {label:'Drying', stages:['Drying']},
    {label:'Pressing', stages:['Ironing']},
    {label:'QC', stages:['Quality Control']},
    {label:'Packing', stages:['Packing']},
  ];
  const gAll = allGarments().filter(g=>!['Ready','Dispatched','Delivered'].includes(orderOf(g.orderId)?.status));
  const stageLoad = stageBuckets.map(b=>({label:b.label, count: gAll.filter(g=>b.stages.includes(g.stage)).length}));
  const maxStage = Math.max(1, ...stageLoad.map(s=>s.count));
  const bottleneck = stageLoad.slice().sort((a,b)=>b.count-a.count)[0];

  // ---- 14-day revenue sparkline (no order history yet — seeded, deterministic shape around today's revenue) ----
  const spark = Array.from({length:14}, (_,i)=>{
    const wobble = pseudoDelta('rev'+i, -22, 22);
    return Math.max(0, Math.round(revenue*(0.55 + i*0.03) * (1+wobble/100) / 1000));
  });
  const maxSpark = Math.max(1, ...spark);

  return `
    <div class="flex-between" style="flex-wrap:wrap; gap:12px; padding-bottom:14px; border-bottom:2px solid var(--line); margin-bottom:20px;">
      <div class="chip-row">
        ${DASH_RANGES.map(r=>`<span class="chip ${dashRange===r.id?'selected':''}" data-dash-range="${r.id}">${r.name}</span>`).join('')}
      </div>
      <button class="btn btn-outline btn-sm">📅 Last 30 days</button>
      <span class="tiny-muted">compared with previous period</span>
      <span style="margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm">All branches</button>
        <button class="btn btn-outline btn-sm">Export report</button>
      </span>
    </div>

    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-icon" style="background:var(--ok-soft); color:var(--ok);">${kpiIconSvg('wallet')}</div><div class="k-label">Revenue</div><div class="k-value">${fmt(revenue)}</div><div class="k-delta up">▲ 12% vs prev.</div></div>
      <div class="kpi"><div class="kpi-icon" style="background:var(--info-soft); color:var(--info);">${kpiIconSvg('list')}</div><div class="k-label">Orders</div><div class="k-value">${todayOrders}</div><div class="k-delta">${newCust} new customers</div></div>
      <div class="kpi"><div class="kpi-icon" style="background:var(--violet-soft); color:var(--violet);">${kpiIconSvg('hanger')}</div><div class="k-label">Garments</div><div class="k-value">${garmentCount}</div><div class="k-delta">${fmt(Math.round(revenue/garmentCount))} per garment</div></div>
      <div class="kpi"><div class="kpi-icon" style="background:var(--teal-soft); color:var(--teal);">${kpiIconSvg('trend')}</div><div class="k-label">Avg. order value</div><div class="k-value">${fmt(aov)}</div><div class="k-delta up">▲ 4%</div></div>
      <div class="kpi"><div class="kpi-icon" style="background:var(--warn-soft); color:var(--warn);">${kpiIconSvg('repeat')}</div><div class="k-label">Repeat rate</div><div class="k-value">${repeatPct}%</div><div class="k-delta">of orders from returning</div></div>
      <div class="kpi kpi-danger"><div class="kpi-icon">${kpiIconSvg('alert')}</div><div class="k-label">At risk / delayed</div><div class="k-value">${atRisk}</div><div class="k-delta">needs attention now</div></div>
    </div>

    <section style="margin-top:32px;">
      <div class="flex-between" style="padding-bottom:9px; border-bottom:2px solid var(--line); flex-wrap:wrap; gap:12px;">
        <h5 style="margin:0; font-size:15px;">Service performance</h5>
        <span style="display:flex; align-items:center; gap:8px;">
          <span class="tiny-muted" style="text-transform:uppercase; letter-spacing:.06em;">Sort by</span>
          <span class="chip-row">${DASH_SORTS.map(s=>`<span class="chip ${dashSort===s.id?'selected':''}" data-dash-sort="${s.id}">${s.name}</span>`).join('')}</span>
        </span>
      </div>
      <div class="tbl-wrap mt-12"><table>
        <tr><th>Service</th><th style="text-align:right;">Orders</th><th style="text-align:right;">Customers</th><th style="text-align:right;">Garments</th><th style="text-align:right;">Avg / order</th><th style="text-align:right;">Revenue</th><th style="width:200px;">Share of revenue</th><th style="text-align:right;">vs prev.</th></tr>
        ${svcRows.map(r=>{
          const sharePct = Math.round(r.revenue/totalSvcRev*100);
          const delta = pseudoDelta(r.name, -6, 11);
          return `<tr>
            <td style="font-weight:600;">${r.name}</td>
            <td style="text-align:right;">${r.orders}</td>
            <td style="text-align:right;">${r.customers}</td>
            <td style="text-align:right;">${r.garments}</td>
            <td style="text-align:right;">${fmt(r.aov)}</td>
            <td style="text-align:right; font-weight:600;">${fmt(r.revenue)}</td>
            <td><div style="display:flex; align-items:center; gap:9px;"><div style="flex:1; height:11px; background:var(--surface-3); min-width:60px;"><div style="width:${sharePct}%; height:100%; background:var(--ink);"></div></div><span style="font-size:12px; font-weight:600; width:38px; text-align:right;">${sharePct}%</span></div></td>
            <td style="text-align:right; font-size:12.5px;">${deltaTag(delta)}</td>
          </tr>`;
        }).join('')}
      </table></div>
      <div class="grid" style="grid-template-columns:repeat(4,1fr); margin-top:16px; border:1px solid var(--line);">
        <div style="padding:12px 14px; border-right:1px solid var(--line);"><div class="tiny-muted" style="text-transform:uppercase; letter-spacing:.08em;">Biggest revenue share</div><div style="font-weight:800; font-size:16px; margin-top:4px;">${topSvc?topSvc.name:'—'}</div><div class="small-muted">${topSvc?Math.round(topSvc.revenue/totalSvcRev*100):0}% of revenue</div></div>
        <div style="padding:12px 14px; border-right:1px solid var(--line);"><div class="tiny-muted" style="text-transform:uppercase; letter-spacing:.08em;">Most customers</div><div style="font-weight:800; font-size:16px; margin-top:4px;">${topCustSvc?topCustSvc.name:'—'}</div><div class="small-muted">${topCustSvc?topCustSvc.customers:0} customers used it</div></div>
        <div style="padding:12px 14px; border-right:1px solid var(--line);"><div class="tiny-muted" style="text-transform:uppercase; letter-spacing:.08em;">Fastest growing</div><div style="font-weight:800; font-size:16px; margin-top:4px;">Dry Clean</div><div class="small-muted">small base, high margin</div></div>
        <div style="padding:12px 14px;"><div class="tiny-muted" style="text-transform:uppercase; letter-spacing:.08em;">Declining</div><div style="font-weight:800; font-size:16px; margin-top:4px;">Press Only</div><div class="small-muted">customers trading up to Wash &amp; Iron</div></div>
      </div>
    </section>

    <div class="grid" style="grid-template-columns:repeat(2,1fr); gap:28px; margin-top:34px; align-items:start;">
      <section>
        <div class="flex-between" style="padding-bottom:9px; border-bottom:2px solid var(--line);"><h5 style="margin:0; font-size:15px;">Where orders come from</h5><span class="tiny-muted" style="text-transform:uppercase; letter-spacing:.06em;">Channel</span></div>
        <div style="display:flex; height:26px; margin-top:16px; border:1px solid var(--line);">
          ${channels.map(c=>`<div style="width:${c.pct}%; background:${c.color};"></div>`).join('')}
        </div>
        <div class="stack mt-12" style="gap:8px;">
          ${channels.map(c=>`<div class="flex-between" style="font-size:13px;"><span style="display:flex; gap:8px; align-items:center;"><i style="width:9px; height:9px; display:block; background:${c.color};"></i>${c.name}</span><span style="font-weight:600;">${c.pct}% &middot; ${fmt(c.revenue)}</span></div>`).join('')}
        </div>
        <div class="flex-between" style="padding-bottom:9px; border-bottom:2px solid var(--line); margin-top:26px;"><h5 style="margin:0; font-size:15px;">Customer segments</h5><span class="tiny-muted" style="text-transform:uppercase; letter-spacing:.06em;">Share of revenue</span></div>
        <div class="tbl-wrap mt-12"><table>
          <tr><th>Segment</th><th style="text-align:right;">Customers</th><th style="width:120px;">Revenue</th><th style="text-align:right;">Avg / order</th></tr>
          ${segments.map(g=>`<tr>
            <td style="font-weight:600;">${g.name}</td>
            <td style="text-align:right;">${g.count}</td>
            <td><div style="display:flex; align-items:center; gap:8px;"><div style="flex:1; height:10px; background:var(--surface-3); min-width:40px;"><div style="width:${g.pct}%; height:100%; background:var(--ink);"></div></div><span style="font-size:12px; font-weight:600;">${g.pct}%</span></div></td>
            <td style="text-align:right;">${fmt(g.aov)}</td>
          </tr>`).join('')}
        </table></div>
      </section>

      <section>
        <div class="flex-between" style="padding-bottom:9px; border-bottom:2px solid var(--line);"><h5 style="margin:0; font-size:15px;">Top items by revenue</h5><span class="tiny-muted" style="text-transform:uppercase; letter-spacing:.06em;">30 days</span></div>
        <div class="tbl-wrap mt-12"><table>
          <tr><th>Item</th><th>Service</th><th style="text-align:right;">Qty</th><th style="width:110px;">Revenue</th></tr>
          ${topItems.map(t=>`<tr>
            <td style="font-weight:600;">${t.item}</td>
            <td class="small-muted">${t.service}</td>
            <td style="text-align:right;">${t.qty}</td>
            <td><div style="display:flex; align-items:center; gap:8px;"><div style="flex:1; height:10px; background:var(--surface-3); min-width:34px;"><div style="width:${Math.round(t.revenue/maxItemRev*100)}%; height:100%; background:var(--ink);"></div></div><span style="font-size:12px; font-weight:600; white-space:nowrap;">${fmt(t.revenue)}</span></div></td>
          </tr>`).join('')}
        </table></div>
        <div class="card mt-20">
          <div class="card-pad" style="border-bottom:2px solid var(--line); font-weight:800; font-size:13.5px;">Read of the period</div>
          <div class="card-pad stack" style="gap:9px; font-size:13px;">
            <div>${topSvc?topSvc.name:'Hotel linen'} carries the revenue but only ${topCustSvc?topCustSvc.customers:'a handful of'} customers — losing one contract would cost a meaningful share of the month.</div>
            <div>Repeat rate is ${repeatPct}% — most of this month's orders are from customers who've ordered before, not first-time trial.</div>
            <div>${outstanding>0? fmt(outstanding)+' is still outstanding, mostly corporate credit accounts settled monthly.' : 'No outstanding balances right now.'}</div>
          </div>
        </div>
      </section>
    </div>

    <div class="grid" style="grid-template-columns:repeat(3,1fr); gap:28px; margin-top:30px; align-items:start;">
      <section>
        <div class="flex-between" style="padding-bottom:9px; border-bottom:2px solid var(--line);"><h5 style="margin:0; font-size:15px;">Orders needing attention</h5><a href="#" data-admin-tab="orders" style="font-size:11px; text-transform:uppercase; letter-spacing:.06em; text-decoration:none;">All orders →</a></div>
        <div class="tbl-wrap"><table>
          <tr><th>Order</th><th>Customer</th><th>Stage</th><th>Due</th></tr>
          ${orders.filter(o=>o.sla!=='on_track').map(o=>`
            <tr class="row-click" data-open-order="${o.id}">
              <td style="font-weight:600;">${o.id}</td><td>${custName(o.custId)}</td><td>${slaPill(o.sla)}</td><td class="mono">${o.dueAt}</td>
            </tr>`).join('') || `<tr><td colspan="4" class="tiny-muted">Nothing at risk right now.</td></tr>`}
        </table></div>
      </section>

      <section>
        <div class="flex-between" style="padding-bottom:9px; border-bottom:2px solid var(--line);"><h5 style="margin:0; font-size:15px;">Load through the plant</h5><span class="tiny-muted" style="text-transform:uppercase; letter-spacing:.06em;">Garments &middot; live</span></div>
        <div class="stack" style="gap:12px; padding-top:14px;">
          ${stageLoad.map(s=>`
            <div>
              <div class="flex-between" style="font-size:12.5px; margin-bottom:4px;"><span>${s.label}${s.label===bottleneck.label && s.count>0 ? ' <span style="color:var(--accent);">· bottleneck</span>' : ''}</span><span style="font-weight:600;">${s.count}</span></div>
              <div style="height:12px; background:var(--surface-3);"><div style="width:${Math.round(s.count/maxStage*100)}%; height:100%; background:${s.label===bottleneck.label && s.count>0 ? 'var(--accent)' : 'var(--ink)'};"></div></div>
            </div>`).join('')}
        </div>
        <p class="tiny-muted" style="margin-top:14px;">${bottleneck.count>0 ? bottleneck.label+' is holding the most garments right now — worth a look if it keeps climbing.' : 'No stage is currently backed up.'}</p>
      </section>

      <section>
        <div class="flex-between" style="padding-bottom:9px; border-bottom:2px solid var(--line);"><h5 style="margin:0; font-size:15px;">Revenue · last 14 days</h5><span class="tiny-muted" style="text-transform:uppercase; letter-spacing:.06em;">₹ thousands</span></div>
        <div style="display:flex; align-items:flex-end; gap:3px; height:110px; margin-top:14px; border-bottom:1px solid var(--line);">
          ${spark.map((v,i)=>`<div title="${v}k" style="flex:1; height:${Math.max(4,Math.round(v/maxSpark*100))}%; background:${i===spark.length-1?'var(--accent)':'var(--ink)'};"></div>`).join('')}
        </div>
        <div class="stack mt-16" style="gap:10px;">
          <div class="card card-pad">
            <div class="section-title">Approvals pending</div>
            <div class="stack mt-12" style="gap:10px;">
              ${approvals.filter(a=>a.status==='pending').slice(0,2).map(a=>`
                <div class="flex-between" style="align-items:flex-start;">
                  <div><div style="font-weight:600; font-size:12.8px;">${a.type}</div><div class="tiny-muted">${a.entity}</div></div>
                  ${a.amount ? `<div class="mono" style="font-size:12.5px;">${fmt(a.amount)}</div>` : ''}
                </div>
              `).join('') || '<div class="tiny-muted">All clear.</div>'}
            </div>
            <button class="btn btn-outline btn-sm mt-16" data-admin-tab="approvals" style="width:100%; justify-content:center;">Open Approval Inbox</button>
          </div>
        </div>
      </section>
    </div>
  `;
}

/* ---------------- New Order / POS ---------------- */
let posState = { custId:null, items:[], promo:0, walletUse:0 };
let posServiceFilter = null; // which service's items are currently shown in the item picker

function addCustomerModal(){
  return `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal">
        <h3>New customer</h3>
        <div class="muted">Add them once here — they're selected for this order automatically.</div>
        <div class="form-row mt-12">
          <div class="field"><label>Full name</label><input id="ncName" placeholder="e.g. Deepesh Arjunan"/></div>
          <div class="field"><label>Phone</label><input id="ncPhone" placeholder="+91 …"/></div>
        </div>
        <div class="field mt-12"><label>Address</label><input id="ncAddr" placeholder="Door no., street, area, city"/></div>
        <div class="form-row mt-12">
          <div class="field"><label>Price list</label>
            <select id="ncProfile">${priceProfiles.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Fold preference</label>
            <select id="ncFold"><option>Folded</option><option>Hanger</option><option>Boxed</option></select>
          </div>
        </div>
        <div class="flex-between mt-20">
          <button class="btn btn-outline" data-close-modal>Cancel</button>
          <button class="btn btn-primary" id="saveNewCustomer">Add &amp; select customer</button>
        </div>
      </div>
    </div>
  `;
}

function renderNewOrder(){
  const s = posState;
  const cust = s.custId ? custById(s.custId) : null;
  const subtotal = s.items.reduce((a,i)=>a+i.price*i.qty,0);
  const gst = settings.taxEnabled ? Math.round(subtotal*0.18) : 0;
  const walletMax = cust ? cust.wallet : 0;
  const walletUse = Math.min(s.walletUse, walletMax, subtotal+gst);
  const total = Math.max(0, subtotal + gst - walletUse);

  const catalog = activeCatalog(cust ? cust.priceProfileId : 'PL1');
  const services = [...new Set(catalog.map(c=>c.service))];
  const effectiveService = services.includes(posServiceFilter) ? posServiceFilter : (services[0] || null);
  const filteredItems = effectiveService ? catalog.filter(c=>c.service===effectiveService) : [];

  return `
    <div class="grid" style="grid-template-columns:1.5fr 1fr; align-items:start;">
      <div class="stack">
        <div class="card card-pad">
          <div class="section-title">1. Customer</div>
          ${cust ? `
            <div class="flex-between mt-12">
              <div><b>${cust.name}</b> ${tierPill(cust.tier)}<div class="tiny-muted mt-8">${cust.phone} &middot; ${cust.points} pts &middot; Wallet ${fmt(cust.wallet)}</div>
              <div class="tiny-muted">Care: ${cust.fold} fold &middot; ${cust.detergent} detergent</div></div>
              <button class="btn btn-outline btn-sm" id="posChangeCust">Change</button>
            </div>` : `
            <div class="field mt-12"><input id="posCustSearch" placeholder="Search name or phone…"/></div>
            <div class="chip-row mt-12">
              ${customers.map(c=>`<span class="chip" data-pos-cust="${c.id}">${c.name}</span>`).join('')}
              <span class="chip" id="posNewCustomer" style="color:var(--accent); border-color:var(--accent); border-style:dashed;">+ New customer</span>
            </div>
          `}
        </div>

        ${s.items.length ? `
        <div class="card card-pad">
          <div class="section-title">2. Order items</div>
          <div class="tbl-wrap mt-12"><table>
            <tr><th>Item</th><th>Service</th><th>Qty</th><th>Price</th><th></th></tr>
            ${s.items.map((it,idx)=>`
              <tr><td>${it.item}</td><td class="small-muted">${it.service}</td>
                <td><input type="number" min="1" value="${it.qty}" data-qty-idx="${idx}" style="width:56px; padding:5px 7px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);"/></td>
                <td class="mono">${fmt(it.price*it.qty)}</td>
                <td><button class="btn-ghost" data-rm-idx="${idx}">✕</button></td></tr>
            `).join('')}
          </table></div>
        </div>` : ''}

        <div class="card card-pad">
          <div class="flex-between"><div class="section-title" style="margin:0;">${s.items.length ? '3.' : '2.'} Add items</div>
            <span class="small-muted">Catalog: <b style="color:var(--ink);">${profileName(cust?cust.priceProfileId:'PL1')}</b> &middot; <span class="link" data-admin-tab="pricelists" style="color:var(--accent); cursor:pointer;">manage price lists →</span></span>
          </div>

function renderAll(){
  document.querySelectorAll('#wsSwitch button').forEach(b=>b.classList.toggle('active', b.dataset.ws===workspace));
  const root = document.getElementById('workspaceRoot');
  if(workspace==='admin') root.innerHTML = renderAdminShell();
  else if(workspace==='portal') root.innerHTML = renderPortal();
  else root.innerHTML = renderDriver();
  wireEvents();
}

function showToast(msg){
  let t = document.getElementById('lwToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'lwToast';
    t.style.cssText = 'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:var(--radius-md); font-size:13px; z-index:200; box-shadow:var(--shadow-lg); opacity:0; transition:opacity .2s;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  requestAnimationFrame(()=>{ t.style.opacity = '1'; });
  clearTimeout(t._to);
  t._to = setTimeout(()=>{ t.style.opacity='0'; }, 1900);
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function openModal(html){ document.getElementById('modalRoot').innerHTML = html; wireModalEvents(); }

function wireEvents(){
  document.querySelectorAll('#wsSwitch button').forEach(b=>b.addEventListener('click', ()=>{ workspace=b.dataset.ws; renderAll(); }));

  if(workspace==='admin') wireAdmin();
  if(workspace==='portal') wirePortal();
  if(workspace==='driver') wireDriver();
  wireModalEvents();
}

  document.querySelectorAll('[data-approve]').forEach(el=>el.addEventListener('click', ()=>{
    const a = approvals.find(x=>x.id===el.dataset.approve); a.status='approved'; a.decidedBy='Nithya Raj (Branch Manager)';
    showToast('Approved — action executed and logged to the audit trail'); renderAll();
  }));
  document.querySelectorAll('[data-reject]').forEach(el=>el.addEventListener('click', ()=>{
    const a = approvals.find(x=>x.id===el.dataset.reject); a.status='rejected'; a.decidedBy='Nithya Raj (Branch Manager)';
    showToast('Rejected — requester notified, nothing executed'); renderAll();
  }));

  // Settings
  const taxToggle = document.getElementById('taxToggle');
  if(taxToggle) taxToggle.addEventListener('click', ()=>{ settings.taxEnabled = !settings.taxEnabled; showToast(settings.taxEnabled ? 'GST enabled — now applied on new orders' : 'GST disabled'); renderAll(); });

  // Copilot
  const copilotSend = document.getElementById('copilotSend');
  const copilotInput = document.getElementById('copilotInput');
  function askCopilot(q){
    if(!q) return;
    copilotLog.push({who:'user', text:q});
    copilotLog.push(copilotAnswer(q));
    renderAll(); adminTab='copilot';
  }
  if(copilotSend) copilotSend.addEventListener('click', ()=>askCopilot(copilotInput.value.trim()));
  if(copilotInput) copilotInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') askCopilot(copilotInput.value.trim()); });
  document.querySelectorAll('[data-copilot-suggest]').forEach(el=>el.addEventListener('click', ()=>askCopilot(el.dataset.copilotSuggest)));
}

function copilotAnswer(q){
  const ql = q.toLowerCase();
  if(ql.includes('risk') || ql.includes('sla')){
    const risky = orders.filter(o=>o.sla!=='on_track');
    return {who:'ai', text:`${risky.length} orders are at risk or breached today: ${risky.map(o=>o.id).join(', ')}. The most urgent is ${risky[0]?.id}, due ${risky[0]?.dueAt}.`, cite:'Source: Orders table, SLA status field · data as of 10 Sep 2026, 11:20 AM'};
  }
  if(ql.includes('revenue')){
    const rev = orders.reduce((s,o)=>s+o.total,0);
    return {who:'ai', text:`Today's revenue across ${orders.length} orders is ${fmt(rev)}, an average order value of ${fmt(Math.round(rev/orders.length))}.`, cite:'Source: Orders table, total field · today, Main Store branch'};
  }
  if(ql.includes('profit')){
    return {who:'ai', text:`Wash & Iron and Wash & Fold carry the highest contribution margin once chemical and labour cost are allocated; Special Treatment (sarees) and Express services have the thinnest margin due to handling time. Full per-service costing needs Phase 19 (Inventory) and Phase 22 (Payroll) data to be precise — this is a directional answer, not a final number.`, cite:'Source: Service Profitability model (blueprint §49) — not yet backed by real cost data'};
  }
  return {who:'ai', text:"I can only answer from real data already in the system — orders, garments, payments, staff, and inventory. Try asking about today's revenue, at-risk orders, or inventory levels.", cite:'Grounding rule: ADR-08 — no invented numbers'};
}

function wirePortal(){
  document.querySelectorAll('[data-portal-tab]').forEach(el=>el.addEventListener('click', ()=>{ portalTab = el.dataset.portalTab; renderAll(); }));
  document.querySelectorAll('[data-portal-track]').forEach(el=>el.addEventListener('click', ()=>showToast('Tracking '+el.dataset.portalTrack)));
  document.querySelectorAll('[data-reorder]').forEach(el=>el.addEventListener('click', ()=>showToast('New order created from '+el.dataset.reorder)));
  document.querySelectorAll('[data-consent-toggle]').forEach(el=>el.addEventListener('click', ()=>{
    const c = custById(portalCustomerId); const key = el.dataset.consentToggle;
    c.consent[key] = !c.consent[key]; showToast('Consent updated — logged with timestamp and source'); renderAll();
  }));
  const exportBtn = document.querySelector('[data-export-data]');
  if(exportBtn) exportBtn.addEventListener('click', ()=>showToast('📦 Export request received — we\'ll notify you when it\'s ready'));
  const delBtn = document.querySelector('[data-delete-account]');
  if(delBtn) delBtn.addEventListener('click', ()=>showToast('Deletion request submitted for manager approval'));
}

function wireDriver(){
  document.querySelectorAll('[data-driver-stop]').forEach(el=>el.addEventListener('click', ()=>{ driverStopOpen = el.dataset.driverStop; renderAll(); }));
  const back = document.querySelector('[data-driver-back]');
  if(back) back.addEventListener('click', ()=>{ driverStopOpen = null; renderAll(); });
  const complete = document.querySelector('[data-complete-stop]');
  if(complete) complete.addEventListener('click', ()=>{
    showToast('✓ Verified — marked complete, customer notified');
    driverStops = driverStops.filter(s=>s.id!==complete.dataset.completeStop);
    driverStopOpen = null; renderAll();
  });
}

function wireModalEvents(){
  const backdrop = document.getElementById('modalBackdrop');
  if(!backdrop) return;
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) closeModal(); });
  document.querySelectorAll('[data-close-modal]').forEach(el=>el.addEventListener('click', closeModal));

  const saveNewCustomer = document.getElementById('saveNewCustomer');
  if(saveNewCustomer) saveNewCustomer.addEventListener('click', ()=>{
    const name = document.getElementById('ncName').value.trim();
    const phone = document.getElementById('ncPhone').value.trim();
    const addr = document.getElementById('ncAddr').value.trim();
    const profileId = document.getElementById('ncProfile').value;
    const fold = document.getElementById('ncFold').value;
    if(!name || !phone){ showToast('Enter at least a name and phone number'); return; }
    const id = nid('C');
    customers.push({id, name, phone, tier:'Silver', points:0, wallet:0, lifetimeSpend:0, orders:0, addr: addr || '—', consent:{whatsapp:false, sms:false, email:false}, fold, detergent:'Regular', priceProfileId:profileId});
    posState.custId = id;
    posServiceFilter = null;
    closeModal();
    renderAll();
    showToast('Customer "' + name + '" added');
  });

  const saveAddPrice = document.getElementById('saveAddPrice');
  if(saveAddPrice) saveAddPrice.addEventListener('click', ()=>{
    const item = document.getElementById('apItem').value.trim();
    const service = document.getElementById('apService').value.trim();
    const rupees = Number(document.getElementById('apPrice').value);
    if(!item || !service || !rupees || rupees<=0){ showToast('Enter item, service and a valid price'); return; }
    priceList.push(pl(item, service, Math.round(rupees*100), priceListFilter));
    closeModal();
    renderAll();
    showToast('Added to ' + profileName(priceListFilter));
  });

  const saveAddProfile = document.getElementById('saveAddProfile');
  if(saveAddProfile) saveAddProfile.addEventListener('click', ()=>{
    const name = document.getElementById('apfName').value.trim();
    const desc = document.getElementById('apfDesc').value.trim();
    if(!name){ showToast('Enter a name for the price list'); return; }
    const id = 'PL'+(priceProfiles.length+1);
    priceProfiles.push({id, name, desc: desc || 'Custom price list'});
    priceListFilter = id;
    closeModal();
    renderAll();
    showToast('Price list "' + name + '" created');
  });
}

renderAll();
</script>
